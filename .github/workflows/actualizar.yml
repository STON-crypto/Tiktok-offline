name: Actualizador Automatico de TikTok

on:
  schedule:
    - cron: '0 0 * * *' # Se ejecuta automáticamente todos los días a la medianoche
  workflow_dispatch: # Te permite ejecutarlo manualmente con un botón cuando quieras

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Ejecutar script de extracción
        run: |
          python actualizar_lista.py

      - name: Guardar cambios en la nube
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-actualización de links de TikTok"
          file_pattern: "links.json"
